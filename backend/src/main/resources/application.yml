# ============================================================
# Основной конфигурационный файл
# ============================================================

spring:
  application:
    name: chart-service

  # Профили
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # База данных
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chartdb}
    username: ${DB_USERNAME:chart_user}
    password: ${DB_PASSWORD:chart_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ChartHikariPool

  # JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: ${HIBERNATE_SHOW_SQL:false}
        use_sql_comments: true
        # ✅ generate_statistics - свойство Hibernate, IDE может не знать о нём
        generate_statistics: ${HIBERNATE_GENERATE_STATS:false}
        jdbc:
          batch_size: 50
          fetch_size: 100

  # Flyway миграции
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history

  # Redis кэш
  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: false
      key-prefix: "chart:"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: chart-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"


# ============================================================
# Сервер
# ============================================================

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  forward-headers-strategy: framework


# ============================================================
# Логирование
# ============================================================

logging:
  level:
    com.clickready.chart: ${LOG_LEVEL:DEBUG}
    org.springframework.web: INFO
    org.hibernate.SQL: ${HIBERNATE_SHOW_SQL:false}
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


# ============================================================
# Management / Actuator
# ============================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: chart-service
  prometheus:
    metrics:
      export:
        enabled: true


# ============================================================
# SpringDoc OpenAPI
# ============================================================

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
  packages-to-scan: com.clickready.chart.presentation


# ============================================================
# Resilience4j (отказоустойчивость)
# ============================================================

resilience4j:
  circuitbreaker:
    instances:
      chartService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      externalApi:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      chartService:
        max-attempts: 3
        wait-duration: 1000
        retry-exceptions:
          - org.springframework.dao.DataAccessException
          - java.net.SocketTimeoutException
      externalApi:
        max-attempts: 3
        wait-duration: 1000
        retry-exceptions:
          - org.springframework.web.client.RestClientException
          - java.net.SocketTimeoutException


# ============================================================
# Внешние API
# ============================================================

external:
  api:
    base-url: ${EXTERNAL_API_URL:https://api.example.com}
    api-key: ${EXTERNAL_API_KEY:}
    timeout: ${EXTERNAL_API_TIMEOUT:30000}


# ============================================================
# JWT (кастомная конфигурация)
# ============================================================

jwt:
  secret: ${JWT_SECRET:yourSuperSecretKeyForJWTThatIsAtLeast256BitsLong1234567890}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}