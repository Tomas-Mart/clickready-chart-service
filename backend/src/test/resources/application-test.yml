spring:
  # ✅ Настройки базы данных (используем Docker PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/chartdb
    username: chart_user
    password: chart_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  # ✅ Отключаем Security и Kafka для тестов
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # ✅ JPA настройки для тестов
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ✅ Redis кэш для тестов
  cache:
    type: redis
    redis:
      time-to-live: 60000

  # ✅ Flyway отключен для тестов
  flyway:
    enabled: false

# ✅ Логирование
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    com.clickready.chart: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE