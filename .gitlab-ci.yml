# .gitlab-ci.yml
stages:
  - build
  - test
  - quality
  - docker
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

cache:
  paths:
    - .m2/repository/
    - frontend/node_modules/

build-backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn clean compile -B
  artifacts:
    paths:
      - backend/target/

build-frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn test -B
  coverage: '/Total.*?([0-9]{1,3})%/'

quality:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner -Dsonar.projectKey=clickready-chart-service

docker-build:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $DOCKER_IMAGE_TAG -f Dockerfile .
    - docker push $DOCKER_IMAGE_TAG

deploy-dev:
  stage: deploy
  image: alpine/k8s:1.28
  script:
    - kubectl set image deployment/chart-service chart-service=$DOCKER_IMAGE_TAG -n dev
    - kubectl rollout status deployment/chart-service -n dev
  environment:
    name: dev
  only:
    - develop

deploy-prod:
  stage: deploy
  image: alpine/k8s:1.28
  script:
    - kubectl set image deployment/chart-service chart-service=$DOCKER_IMAGE_TAG -n prod
    - kubectl rollout status deployment/chart-service -n prod
  environment:
    name: production
  only:
    - main