stages:
  - build
  - test
  - quality
  - docker
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

cache:
  paths:
    - .m2/repository/
    - frontend/node_modules/

# ==================== BUILD ====================

build-backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn clean compile -B
  artifacts:
    paths:
      - backend/target/

build-frontend:
  stage: build
  image: node:20-alpine
  before_script:
    - apk add --no-cache git
  script:
    - cd frontend
    - npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    - npm run build
  artifacts:
    paths:
      - frontend/build/
      - frontend/dist/

# ==================== TEST ====================

test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_DB: chartdb
    POSTGRES_USER: chart_user
    POSTGRES_PASSWORD: chart_password
  script:
    - cd backend
    - mvn test -B
  coverage: '/Total.*?([0-9]{1,3})%/'

test-frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    - npm run test -- --watchAll=false --coverage
  artifacts:
    paths:
      - frontend/coverage/

# ==================== QUALITY ====================

quality:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner -Dsonar.projectKey=clickready-chart-service
  only:
    - main
    - develop

# ==================== DOCKER ====================

docker-build:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE_TAG -f Dockerfile.backend .
    - docker push $DOCKER_IMAGE_TAG
  only:
    - main
    - develop

# ==================== DEPLOY ====================

deploy-dev:
  stage: deploy
  image: alpine/k8s:1.28
  script:
    - kubectl set image deployment/chart-service chart-service=$DOCKER_IMAGE_TAG -n dev
    - kubectl rollout status deployment/chart-service -n dev
  environment:
    name: dev
  only:
    - develop

deploy-prod:
  stage: deploy
  image: alpine/k8s:1.28
  script:
    - kubectl set image deployment/chart-service chart-service=$DOCKER_IMAGE_TAG -n prod
    - kubectl rollout status deployment/chart-service -n prod
  environment:
    name: production
  only:
    - main